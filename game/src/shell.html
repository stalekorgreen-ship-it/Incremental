<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛЕНТА.EXE — ЛентаОС</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#008080;font:12px Tahoma,Verdana,'Segoe UI',sans-serif;color:#000;transition:background 1.5s;user-select:none}

select{font:12px Tahoma,sans-serif;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;max-width:180px}

.scrollx{overflow:auto}

.mailrow .face{float:left;margin-right:6px}
.card{background:#fff;border:1px solid #808080;padding:5px;display:flex;flex-direction:column;gap:3px}.card.ok{background:#eaffea}
.rule{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px;background:#fff;border:1px solid #808080}

nav{position:fixed;left:0;right:0;bottom:0;height:40px;background:#c0c0c0;border-top:2px solid #fff;display:flex;align-items:center;gap:4px;padding:0 4px;z-index:99999}

.smi{display:flex;align-items:center;gap:6px;padding:4px 6px;cursor:pointer}.smi:hover{background:#000080;color:#fff}.smi.dis{color:#808080}
#toast{position:fixed;right:6px;bottom:46px;width:290px;display:flex;flex-direction:column;gap:4px;z-index:99998}
.tst .bd{background:#ffffe1}
.float{position:fixed;pointer-events:none;font-weight:bold;color:#008000;text-shadow:1px 1px #fff;animation:fl .9s forwards;z-index:100001}

ul{margin:0;padding-left:18px}

.maptools{display:flex;gap:8px;align-items:center;flex:none}.mapwrap{position:relative;flex:1;min-height:200px;border:2px solid;border-color:#808080 #fff #fff #808080}#mapcv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}

.post.story{background:#eef6ff}.post.upd{border-left:4px solid #2e7d32}.post.dnd{opacity:.5;border-left:4px solid #c62828}

.sep{background:#c0c0c0;padding:3px 6px;font-weight:bold;border-top:1px solid #808080;border-bottom:1px solid #808080;position:sticky;top:0}
.post.newsp{background:#f4f0ff}.news.res{border-left:4px solid #000080}.tag.up{background:#d9f2d9}.tag.dn{background:#f6d6d6}
