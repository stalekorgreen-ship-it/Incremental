function clusters(){const A=S.A;if(A.length<8)return;const k=clamp(Math.round(A.length/45),3,8);let C=(S.cent&&S.cent.length==k)?S.cent.map(c=>c.slice()):Array.from({length:k},()=>pk(A).v.slice());

 help:{t:'Справка',i:'help',w:460,h:440,r(){return '<b>Как играть</b><ul><li>Люди пишут посты, они копятся во «Входящих». Раз в несколько секунд пачка уходит в ленту — до этого ты решаешь: ▲ поднять, ▼ закопать или ничего не делать.</li><li>Доход — это внимание. Деньги за клики не платят: платят за то, сколько люди сидят в ленте.</li><li>Пузыри растут только от тебя: если одним показывать «за», а другим «против», они разойдутся. Если показывать всем всё — останутся умеренными.</li><li>Иногда в ленте проскальзывают истории: пропал человек, слух про хлеб, депутат с налогами. Если ты отреагировал, история продолжится, и от охвата и от того, кто её увидел, зависит исход.</li><li>Раз в месяц (5 минут) — счёт за свет и налог на прибыль. Ставку налога меняют выборы и законы из новостей.</li><li>Все улучшения дорожают на 13% после каждой покупки.</li></ul>'}}};
// ---------- карта ----------
let MAPV={hl:null,sel:null};
function drawMap(){const c=$('mapcv');if(!c||!c.getContext)return;const wrap=c.parentElement;const W=wrap.clientWidth,H=wrap.clientHeight;if(c.width!=W||c.height!=H){c.width=W;c.height=H}
 const x=c.getContext('2d');x.fillStyle='#0b1020';x.fillRect(0,0,W,H);const A=S.A;if(!A.length)return;let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;A.forEach(a=>{mnx=Math.min(mnx,a.x);mxx=Math.max(mxx,a.x);mny=Math.min(mny,a.y);mxy=Math.max(mxy,a.y)});
 const sx=(W-30)/Math.max(.5,mxx-mnx),sy=(H-30)/Math.max(.5,mxy-mny);const P=a=>[15+(a.x-mnx)*sx,15+(a.y-mny)*sy];MAPV.P=P;
 x.strokeStyle='rgba(140,160,220,.12)';x.lineWidth=1;x.beginPath();let n=0;for(const a of A){const[p1,q1]=P(a);for(const id of a.fr){if(id<a.id)continue;const b=byId(id);if(!b)continue;const[p2,q2]=P(b);x.moveTo(p1,q1);x.lineTo(p2,q2);if(++n>4000)break}if(n>4000)break}x.stroke();
 const mode=S.mapc||'cl';const hp=MAPV.hl?findPost(MAPV.hl):null;
 for(const a of A){const[px,py]=P(a);let col;if(hp){col=hp.sh.has(a.id)?'#ff3b5c':'#2a3350'}else if(mode=='cl')col=a.cl>=0&&S.clusters[a.cl]?S.clusters[a.cl].col:'#556';else if(mode=='d')col='hsl('+a.d*45+',65%,55%)';else{const v=a.v[+mode];col=v>0?'rgba(80,160,255,'+(.3+v*.7)+')':'rgba(255,90,90,'+(.3-v*.7)+')'}
  x.fillStyle=col;const r=a.char?5:2.6;x.beginPath();x.arc(px,py,r,0,7);x.fill();if(a.char){x.strokeStyle='#fff';x.stroke()}if(MAPV.sel==a.id){x.strokeStyle='#ff0';x.lineWidth=2;x.beginPath();x.arc(px,py,7,0,7);x.stroke();x.lineWidth=1}}
 x.fillStyle='#fff';x.font='11px Tahoma';if(mode!='cl'&&mode!='d')x.fillText('синие: '+ISSUES[+mode].pro+'   красные: '+ISSUES[+mode].con,8,H-8);if(hp)x.fillText('Красные — кто репостнул: «'+hp.txt.slice(0,50)+'…»',8,14)}
function profHTML(a){if(!a)return '';return '<div class="w95 pcard"><div class="tb"><span>Профиль</span><span class="ctl"><i data-a="unprof">×</i></span></div><div class="bd"><div class="row"><span>'+avatar(a.n,4,{seed:a.seed})+'</span><span><b>'+esc(a.n)+'</b><br>'+a.age+' лет · '+DISTRICTS[a.d]+'<br>друзей: '+a.fr.length+(a.cl>=0&&S.clusters[a.cl]?'<br>кластер: '+S.clusters[a.cl].n:'')+'</span></div>'+
 ISSUES.map((x,i)=>'<div class="vrow"><span>'+x.n+'</span><div class="vbar"><i style="left:'+(50+Math.min(0,a.v[i])*50)+'%;width:'+Math.abs(a.v[i])*50+'%;background:'+(a.v[i]>0?'#3a7bd5':'#d53a3a')+'"></i></div></div>').join('')+'<div class="lbl">Настроение: '+(a.mood>.1?'🙂':a.mood<-.1?'😠':'😐')+' · реакций: '+a.eng+'</div>'+(a.last?'<div class="news">Последнее, что зацепило: «'+esc(a.last)+'»</div>':'')+B('Его лента','ufeed','data-id="'+a.id+'"')+'</div></div>'}
// ---------- окна: менеджер ----------
let ZT=10;
function wstate(id){const w=WIN[id];if(!S.wins[id]){const n=Object.keys(S.wins).length;S.wins[id]={open:false,min:false,x:96+(n%6)*34,y:10+(n%6)*26,w:w.w,h:w.h,z:++ZT}}return S.wins[id]}
const avail=id=>!WIN[id].need||has(WIN[id].need);
function openWin(id){if(!avail(id))return;const s=wstate(id);s.open=true;s.min=false;s.z=++ZT;fitWin(s);render();if(id=='mail')icons()}
function fitWin(s){const dw=window.innerWidth,dh=window.innerHeight-40;s.w=Math.min(s.w,dw-4);s.h=Math.min(s.h,dh-4);s.x=clamp(s.x,0,Math.max(0,dw-s.w));s.y=clamp(s.y,0,Math.max(0,dh-s.h))}
function render(){const d=$('wins');Object.keys(WIN).forEach(id=>{const s=S.wins[id];let el=$('w_'+id);if(!s||!s.open||!avail(id)){if(el)el.remove();return}
  if(!el){el=document.createElement('section');el.className='w95 win';el.id='w_'+id;el.innerHTML='<div class="tb" data-drag="'+id+'"><span>'+WIN[id].t+'</span><span class="ctl"><i data-a="wmin" data-id="'+id+'">_</i><i data-a="wmax" data-id="'+id+'">□</i><i data-a="wclose" data-id="'+id+'">×</i></span></div><div class="bd" id="b_'+id+'"></div>';d.appendChild(el);
   el.addEventListener('mousedown',()=>{if(s.z<ZT){s.z=++ZT;render()}});if(window.ResizeObserver)new ResizeObserver(()=>{if(el.offsetWidth>50){s.w=el.offsetWidth;s.h=el.offsetHeight;if(id=='map')drawMap()}}).observe(el);draw(id)}
  el.style.cssText='left:'+s.x+'px;top:'+s.y+'px;width:'+s.w+'px;height:'+s.h+'px;z-index:'+s.z+';display:'+(s.min?'none':'flex');el.classList.toggle('active',s.z==ZT)});taskbar()}
function draw(id){const b=$('b_'+id);if(!b)return;const ae=document.activeElement;if(ae&&b.contains(ae)&&(ae.tagName=='SELECT'||ae.tagName=='INPUT'))return;
 if(id=='map'&&$('mapcv')){drawMap();if(MAPV.sel!=null)$('prof').innerHTML=profHTML(byId(MAPV.sel));return}
 const fb=b.querySelector('.feedbox'),fst=fb?fb.scrollTop:0,st=b.scrollTop;b.innerHTML=WIN[id].r();b.scrollTop=st;const nf=b.querySelector('.feedbox');if(nf)nf.scrollTop=fst;if(id=='dash')spark();if(id=='map')drawMap()}
function taskbar(){$('tasks').innerHTML=Object.keys(WIN).filter(id=>S.wins[id]&&S.wins[id].open&&avail(id)).map(id=>'<button class="b95 task'+(S.wins[id].z==ZT&&!S.wins[id].min?' on':'')+'" data-a="task" data-id="'+id+'">'+WIN[id].t.replace('Свойства: ','')+'</button>').join('')}
function icons(){const unread=S.mails.filter(m=>!m.read).length;$('icons').innerHTML=Object.keys(WIN).filter(id=>avail(id)&&id!='ufeed').map(id=>'<div class="ico" data-a="open" data-id="'+id+'">'+ICONS[WIN[id].i]+'<span>'+WIN[id].t.replace('Свойства: ','')+(id=='mail'&&unread?' ('+unread+')':'')+'</span></div>').join('');
 $('startmenu').innerHTML=Object.keys(WIN).map(id=>'<div class="smi'+(avail(id)?'':' dis')+'" data-a="open" data-id="'+id+'">'+ICONS[WIN[id].i].replace(/width="32" height="32"/,'width="20" height="20"')+' '+WIN[id].t+(avail(id)?'':' 🔒')+'</div>').join('')+'<div class="smi" data-a="reset">⟲ Новая игра</div>'}
function spark(){const c=$('cv');if(!c||!c.getContext)return;const x=c.getContext('2d'),h=S.hist,mx=Math.max(...h,1e-9);x.fillStyle='#000';x.fillRect(0,0,380,110);x.strokeStyle='#0f0';x.beginPath();h.forEach((v,i)=>{const px=i/Math.max(h.length-1,1)*380,py=106-v/mx*100;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}

 if(d.w&&!a){if(S.dict[d.w])delete S.dict[d.w];else{S.dict[d.w]=1;toast('В словаре: «'+d.w+'»')}['feed','news','dict','rules'].forEach(draw);return}
 if(a=='open'){openWin(d.id);$('startmenu').style.display='none'}
 if(a=='wclose'){S.wins[d.id].open=false;render()}if(a=='wmin'){S.wins[d.id].min=true;render()}
 if(a=='wmax'){const s=S.wins[d.id];if(s.w<window.innerWidth-20){s.pw=[s.x,s.y,s.w,s.h];s.x=0;s.y=0;s.w=window.innerWidth;s.h=window.innerHeight-40}else if(s.pw)[s.x,s.y,s.w,s.h]=s.pw;render()}
 if(a=='task'){const s=S.wins[d.id];if(s.min||s.z!=ZT){s.min=false;s.z=++ZT}else s.min=true;render()}
 if(a=='start'){const m=$('startmenu');m.style.display=m.style.display=='block'?'none':'block'}
 if(a=='fn'&&buy('fn',d.id)){const n=FN.find(x=>x.id==d.id);toast('Установлено: <b>'+n.n+'</b>');const wid=Object.keys(WIN).find(k=>WIN[k].need==n.id&&k!='ufeed');icons();if(wid)openWin(wid);osUp();draw('fn');draw('up')}
 if(a=='upg'&&buy('up',d.id)){const u=UPS.find(x=>x.id==d.id);toast('Апгрейд: <b>'+u.n+'</b> — '+u.d);draw('up');draw('fn')}
 if(a=='srv'&&canBuy()){S.m-=price();S.nb++;S.srv++;draw('infra')}
 if(a=='pup'||a=='pdn'){const p=findPost(+d.p);if(p){react(p,a=='pup'?1:-1);['feed','news','ufeed'].forEach(draw)}}
 if(a=='wave'){MAPV.hl=+d.p;openWin('map');setTimeout(()=>{MAPV.hl=null},8000)}
 if(a=='unprof'){MAPV.sel=null;$('prof').innerHTML=''}
 if(a=='ufeed'){UF=+d.id;openWin('ufeed');draw('ufeed')}
 if(a=='undict'){delete S.dict[d.w];draw('dict')}
 if(a=='mkrule'){const D=DRAFT;const r={on:rulesUsed()<cpuTotal(),cond:{word:D.word,topic:+D.topic,stance:+D.stance,emo:+D.emo,src:D.src},aud:has('raud')?{d:+D.d,issue:+D.issue,side:+D.side,age:D.age,cl:+D.cl}:null,w:+D.w};S.rules.push(r);S.rulesMade=(S.rulesMade||0)+1;toast(r.on?'Правило создано':'Правило создано, но выключено: не хватает мощности');draw('rules')}
 if(a=='duprule'){const r=JSON.parse(JSON.stringify(S.rules[i]));r.on=rulesUsed()<cpuTotal();S.rules.push(r);S.rulesMade=(S.rulesMade||0)+1;draw('rules')}
 if(a=='unrule'){S.rules.splice(i,1);draw('rules')}
 if(a=='reset'){if(S.resetAsk){try{localStorage.removeItem('lentaos4')}catch(x){}location.reload()}else{S.resetAsk=1;toast('Нажми «Новая игра» ещё раз, чтобы стереть прогресс');setTimeout(()=>S.resetAsk=0,4000)}}
 stats()});
document.addEventListener('change',e=>{const d=e.target.dataset;if(e.target.id=='mapc'){S.mapc=e.target.value;drawMap()}if(e.target.id=='tg')TG=e.target.value;
 if(d.df){DRAFT[d.df]=e.target.value;$('b_rules').innerHTML=WIN.rules.r()}
 if(d.ron!=null){const r=S.rules[+d.ron];if(e.target.checked&&rulesUsed()>=cpuTotal()){e.target.checked=false;toast('Не хватает мощности.');return}r.on=e.target.checked;draw('rules')}
 if(d.r=='feedT'){S.feedT=+e.target.value;S.nextFeed=Math.min(S.nextFeed,S.t+S.feedT);draw('feed')}});
const OSC=[['#008080','95'],['#3a6ea5','98'],['#5a7d5a','ME'],['#6b4a8a','2000'],['#245edb','XP']];
function osUp(){const i=Math.min(4,Math.floor(S.nb/12));if(S.osI!=null&&i>S.osI)toast('Обновление системы: <b>ЛентаОС '+OSC[i][1]+'</b>');S.osI=i;document.body.style.background=OSC[i][0];$('osn').textContent='ЛентаОС '+OSC[i][1]}
function stats(){$('tray').innerHTML='👥 '+f(S.ema.users||0)+' &nbsp; 💲'+f(S.m)+' &nbsp; '+String(new Date().getHours()).padStart(2,'0')+':'+String(new Date().getMinutes()).padStart(2,'0')}
// ---------- сохранение ----------
function save(){try{const c=Object.assign({},S,{act:S.act.map(s=>Object.assign({},s,{seen:[...(s.seen||[])]}))});localStorage.setItem('lentaos4',JSON.stringify(c))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('lentaos4'));if(o&&o.v==5){S=Object.assign(BASE(),o);S.act.forEach(s=>s.seen=new Set(s.seen||[]));S.batch=[];AMAP.clear();S.A.forEach(a=>AMAP.set(a.id,a));return true}}catch(e){}return false}
let lastFeedAt=-1;
function tick(){S.ema.users_o=S.ema.users;S.ema.inc_o=S.ema.inc;step();stats();
 Object.keys(WIN).forEach(id=>{if(WIN[id].live&&id!='feed'&&S.wins[id]&&S.wins[id].open&&!S.wins[id].min)draw(id)});
 // лента перерисовывается только при новой пачке, чтобы посты не прыгали
 if(S.wins.feed&&S.wins.feed.open){if(S.batchAt!==lastFeedAt){lastFeedAt=S.batchAt;draw('feed')}else{const b=$('b_feed');if(b){const l=Math.max(0,S.nextFeed-S.t);const el=b.querySelector('.row span b');if(el)el.textContent=l+' с';const pr=b.querySelector('.prog i');if(pr)pr.style.width=clamp((1-l/S.feedT)*100,0,100)+'%'}}}
 if(S.wins.map&&S.wins.map.open)drawMap();if(S.t%15==0){icons();render()}if(S.t%5==0)save()}
function boot(){if(!load()){init();['net','feed','fn','mail'].forEach(wstate);const vw=window.innerWidth;Object.assign(S.wins.feed,{x:96,y:8,open:true});Object.assign(S.wins.net,{x:Math.min(590,vw-310),y:8,open:true});Object.assign(S.wins.fn,{x:Math.min(590,vw-570),y:270,open:true});mail(face('Директор',99)+'<b>Директор:</b> Привет, алгоритм. Тут пара десятков людей — мои друзья и их друзья. Сделай так, чтобы они сидели подольше. Посты копятся во «Входящих» — поднимай то, что цепляет, закапывай скучное. Живём с рекламы, за свет и налоги платим раз в месяц.')}
 else for(let i=0;i<20;i++)POOL.push(agentPost(pk(S.A)));ZT=Math.max(10,...Object.values(S.wins).map(w=>w.z||0));osUp();icons();Object.values(S.wins).forEach(fitWin);render();stats();setInterval(tick,1000)}
if(!window.NOBOOT)boot();
</script></body></html>
