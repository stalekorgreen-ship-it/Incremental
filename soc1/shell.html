<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Соцсеть из деталей — проба</title><style>

*{box-sizing:border-box;margin:0;padding:0}
:root{--up:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;--down:inset -1px -1px #fff,inset 1px 1px #000,inset -2px -2px #dfdfdf,inset 2px 2px #808080;--thin:inset -1px -1px #fff,inset 1px 1px #808080;--bar:linear-gradient(90deg,#000080,#1084d0)}
html,body{height:100%;overflow:hidden;font:12px/1.35 "MS Sans Serif","Microsoft Sans Serif",Tahoma,"DejaVu Sans",sans-serif;background:#c0c0c0;color:#000}
body{display:flex;flex-direction:column}
button{font:inherit;background:#c0c0c0;border:0;box-shadow:var(--up);padding:4px 9px;cursor:pointer;color:#000}
button:active:not(:disabled),button.on{box-shadow:var(--down)}button:disabled{color:#808080;text-shadow:1px 1px #fff;cursor:default}
select,input,textarea{font:inherit;border:0;box-shadow:var(--down);background:#fff;padding:3px 4px;min-width:0;color:#000}
.dim{color:#444}[hidden]{display:none!important}
::-webkit-scrollbar{width:16px;height:16px}::-webkit-scrollbar-track{background:repeating-conic-gradient(#fff 0 25%,#c0c0c0 0 50%) 0 0/2px 2px}::-webkit-scrollbar-thumb{background:#c0c0c0;box-shadow:var(--up)}::-webkit-scrollbar-corner{background:#c0c0c0}
#app{height:100%;display:flex;flex-direction:column}
#top{display:flex;gap:5px;padding:4px;align-items:center}#top .stat{box-shadow:var(--down);padding:3px 10px;white-space:nowrap}#v-title{flex:1;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:14px}
#b-check{font-weight:700;font-size:13px;padding:6px 16px;background:#d8f0c0}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;background:#008080;box-shadow:var(--down);touch-action:none;cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0}#wires{position:absolute;overflow:visible;width:1px;height:1px}
#wires .w{fill:none;stroke:#ffd400;stroke-width:3;pointer-events:none;stroke-dasharray:9 5;animation:flow 1s linear infinite}#wires .w.k-t{stroke:#bfe0ff;stroke-dasharray:none;stroke-width:5;animation:none}#wires .w.k-s{stroke:#fff;stroke-dasharray:none;stroke-width:3;animation:none}@keyframes flow{to{stroke-dashoffset:-14}}
#wires .hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}#wires .hit:hover+.w{stroke:#ff5050}
.node{position:absolute;width:236px;background:#c0c0c0;box-shadow:var(--up),3px 3px 0 rgba(0,0,0,.35);padding:3px;user-select:none}
.node.fired{outline:4px solid #ffd400;outline-offset:2px}
.node header{display:flex;gap:3px;align-items:center;background:var(--c);color:#fff;padding:2px 2px 2px 6px;cursor:grab}.node header b{flex:1}.node header button{width:18px;height:16px;padding:0;font-size:11px;font-weight:700}
.ports{padding:3px 0}.port{display:flex;align-items:center;gap:6px;height:21px;cursor:pointer}.port.out{justify-content:flex-end}.port b{display:block;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--k);flex:none;position:relative}.port b::after{content:"";position:absolute;inset:-4px}.port.in b{margin-left:-10px}.port.out b{margin-right:-10px}.port.fit b{box-shadow:0 0 0 4px #ffff60}.port.armed b{background:#ff3b6b}
.cfg label{display:flex;gap:5px;align-items:center;margin:3px 2px}.cfg label span{width:70px;flex:none;font-size:11px;text-align:right}.cfg select,.cfg input{flex:1;font-size:11.5px}
.live{background:#fff;box-shadow:var(--down);padding:3px 6px;margin-top:3px;font-size:11px}.live table{width:100%;border-collapse:collapse}.live td{border-bottom:1px dotted #bbb}.live td:last-child{text-align:right}
#zoom{position:absolute;top:6px;right:6px;display:flex;gap:2px;z-index:20}
#dock{position:absolute;width:max-content;max-width:98%;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:3px;background:#c0c0c0;box-shadow:var(--up),2px 2px 0 rgba(0,0,0,.35);padding:4px;z-index:20}#dock button{border-top:4px solid var(--c);font-weight:700;white-space:nowrap}#dock:empty{display:none}
#empty{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;text-align:center;width:min(420px,90%);line-height:1.8;pointer-events:none;font-size:13px}#empty b{font-size:18px}
#task,#phone{flex:none;overflow:auto;padding:8px 10px;background:#d4d4d4;box-shadow:var(--down);min-height:0}#task{width:262px}#phone{width:300px}
#task h2,#phone h2{font-size:15px;margin:2px 0 6px}#task p,#phone p{margin:6px 0}#task .advice,#task .state{font-size:12.5px}
.about{font-size:10.5px;color:#333;padding:2px 5px 0}
#guide{display:none;position:absolute;left:50%;top:36px;transform:translateX(-50%);width:max-content;max-width:92%;background:#ffffe1;border:2px solid #000;padding:8px 14px;font-weight:700;font-size:14px;text-align:center;z-index:25;box-shadow:3px 3px 0 rgba(0,0,0,.35)}#guide.on{display:block}
#legend{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;color:#fff;font-size:11px;pointer-events:none;z-index:5}#legend i{display:inline-block;width:18px;height:4px;margin-right:5px;vertical-align:middle}
.glow{animation:glow .8s ease-in-out infinite alternate}@keyframes glow{from{outline:3px solid #ffd400;outline-offset:1px}to{outline:3px solid #ff3b6b;outline-offset:3px}}
#phone .phone{width:250px}#phone .screen{height:230px}#phone .row button{padding:3px 6px}
.state{background:#fff;box-shadow:var(--down);padding:6px 9px;margin:6px 0}.state.ok{background:#d8f0c0}.state.bad{background:#ffe0d0}
.advice{background:#ffffe1;border:1px solid #000;padding:5px 8px;margin:6px 0}
.row{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0;align-items:center}.row select{flex:1}
.phone{width:262px;margin:6px auto;background:#222;border-radius:18px;padding:8px}.phone .bar{display:flex;justify-content:space-between;color:#fff;font-size:11px;padding:0 6px 4px}
.screen{background:#eef;border-radius:8px;height:300px;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:5px}.screen.off{background:#000;color:#777;align-items:center;justify-content:center;text-align:center}
.card{background:#fff;box-shadow:var(--thin);padding:5px 7px;overflow:hidden;position:relative}.card small{color:#555;display:block}.card.cut{border-bottom:3px dashed #999}.card .acts{display:flex;gap:6px;align-items:center;margin-top:4px}.card .acts.right{justify-content:flex-end}.card .acts button.lit{background:#ff6a8a;color:#fff;font-weight:700}.card .num{font-weight:700}
.slot{display:block;width:100%;margin:5px 0;border:2px dashed #666;box-shadow:none;background:transparent;padding:7px}
.narr{font-weight:700;margin:5px 0}.log{background:#fff;box-shadow:var(--down);padding:4px 8px;font-size:11.5px;min-height:34px;margin:4px 0}.log div{border-bottom:1px dotted #ccc;padding:1px 0}.log div.ev{font-weight:700}
.big{background:#000;color:#4f4;font:700 28px "DejaVu Sans Mono",monospace;padding:8px 12px;box-shadow:var(--down);margin:5px 0}.big small{display:block;font:12px sans-serif;color:#bdb}
table.d{border-collapse:collapse;width:100%;background:#fff;font-size:12px}table.d td,table.d th{border:1px solid #ccc;padding:2px 7px;text-align:left}
.veil{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}.veil.on{display:flex}
.dlg{width:min(460px,94vw);max-height:92vh;display:flex;flex-direction:column;background:#c0c0c0;box-shadow:var(--up),4px 4px 0 rgba(0,0,0,.4);padding:3px}.dlg h3{background:var(--bar);color:#fff;font-size:12px;padding:3px 7px}.dlg .body{padding:10px 12px;overflow:auto;display:flex;flex-direction:column;gap:8px}.dlg textarea{height:150px}
.lv{display:flex;gap:6px;text-align:left}.lv span{flex:1}
@media (max-width:1150px){#task{width:210px}#phone{width:270px}#phone .phone{width:236px}.node{width:226px}}
@media (max-width:800px){#main{flex-direction:column;overflow:auto}#task,#phone{width:auto;flex:none;overflow:visible}#task{max-height:38%;overflow:auto}#stage{min-height:380px;flex:none}#top{flex-wrap:wrap}#v-title{flex-basis:100%}#legend{display:none}}
</style></head><body>
<div id="app">
 <div id="top"><button id="b-list">Испытания</button><div class="stat" id="v-title"></div><div class="stat" id="v-stage"></div><button id="b-check">✔ Проверить</button></div>
 <div id="main"><aside id="task"></aside>
  <div id="stage"><div id="world"><svg id="wires"></svg></div><div id="zoom"><button id="b-undo" title="Отменить (Ctrl+Z)">↶</button><button data-z="1.15">＋</button><button data-z="0.87">－</button><button data-z="fit">Всё поле</button><button data-z="tidy">Разложить</button></div><div id="guide"></div><div id="legend"><span><i style="background:#fff"></i>что внутри чего</span><span><i style="background:#ffd400"></i>событие</span><span><i style="background:#bfe0ff"></i>таблица</span><span>провод убирается нажатием</span></div><div id="dock"></div></div>
  <aside id="phone"></aside>
 </div></div>
<div class="veil" id="veil"><div class="dlg"><h3 id="d-h"></h3><div class="body" id="d-b"></div></div></div>
<script>
/*JS*/
</script></body></html>
