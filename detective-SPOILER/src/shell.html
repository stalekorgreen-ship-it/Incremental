<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЛентаОС 95 — расследование</title><style>/*CSS*/</style></head><body>
<div class="bar"><b>ЛентаОС 95</b><span id="clock"></span><span id="money"></span><span id="users"></span><span id="sat"></span><span style="flex:1"></span><button id="spd" title="Только для проверки">Тест: ×1</button><button id="pause">Esc: пауза</button></div>
<div id="browser" class="win"><div class="title">Обозреватель</div>
<div id="nav"><button id="back" aria-label="Назад">←</button><div id="omni"><input id="addr" aria-label="Поиск и адрес" placeholder="Начните вводить: свет, делегация, whois…" autocomplete="off"><div id="sugg" hidden></div></div></div>
<div id="marks"><button data-u="lenta.set">Лента</button><button data-u="chat.set" id="m-chat">Чат</button><button data-u="admin.set">Админка</button><button data-u="dosie.set">Досье</button><button data-u="vestnik-velarii.vl">Новости</button><button data-u="otvet.set">Назвать имя</button></div>

<div id="view"><div id="p-feed"><div id="wrap"><div id="board"><div id="sizer"><div id="field"><svg id="wires"></svg></div></div></div><div id="zoom"><button id="zout" aria-label="Отдалить">−</button><button id="zin" aria-label="Приблизить">+</button></div></div>
<div id="side"><div class="win"><h3>Магазин</h3><div id="shop"></div></div><div class="win"><h3>Лента пользователей</h3><div id="feed"></div></div></div></div><div id="p-page" hidden></div></div></div>
<div class="over" id="po" hidden><div class="win"><h3>Пауза</h3><div><p>Время остановлено. Игра сохранена.</p><button id="go">Продолжить</button><div id="pcp"></div><button id="new1">Новая игра</button></div></div></div>
<div class="over" id="so" hidden><div class="win"><h3 id="sh"></h3><div id="sb"></div></div></div>
<div class="over" id="eo" hidden><div class="win"><h3 id="eh"></h3><div><div id="eb"></div><div id="ecp"></div><button id="new2">Новая игра</button></div></div></div>
<script>/*JS*/</script></body></html>
